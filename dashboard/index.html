<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Plug Pilot — Comparativo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root{--bg:#f4f3ef;--surface:#fff;--border:rgba(0,0,0,0.09);--text:#1a1a18;--muted:#6b6a66;--hint:#9c9a92;--green:#3b6d11;--green-bg:#eaf3de;--green-mid:#639922;--amber:#854f0b;--amber-bg:#faeeda;--amber-mid:#ef9f27;--red:#a32d2d;--red-bg:#fcebeb;--red-mid:#e24b4a;--blue:#185fa5;--blue-bg:#e6f1fb;--blue-mid:#378add;--purple:#534ab7;--purple-bg:#eeedfe;--r:10px;}
    @media(prefers-color-scheme:dark){:root{--bg:#181816;--surface:#222220;--border:rgba(255,255,255,0.09);--text:#eeebe3;--muted:#888780;--hint:#5f5e5a;--green:#97c459;--green-bg:#27500a;--green-mid:#639922;--amber:#ef9f27;--amber-bg:#633806;--amber-mid:#ba7517;--red:#f09595;--red-bg:#501313;--red-mid:#e24b4a;--blue:#85b7eb;--blue-bg:#0c447c;--blue-mid:#378add;--purple:#afa9ec;--purple-bg:#3c3489;}}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:0.5px solid var(--border);background:var(--surface);flex-shrink:0;}
    .topbar h1{font-size:15px;font-weight:500;}.topbar p{font-size:11px;color:var(--muted);margin-top:1px;}
    .topbar-right{display:flex;align-items:center;gap:8px;}
    .pill{font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px;white-space:nowrap;}
    .pill-green{background:var(--green-bg);color:var(--green);}.pill-blue{background:var(--blue-bg);color:var(--blue);}
    .sync{font-size:11px;color:var(--hint);}
    .tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--surface);flex-shrink:0;}
    .tab{padding:10px 22px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;display:flex;align-items:center;gap:7px;}
    .tab:hover{color:var(--text);}.tab.active{color:var(--text);border-bottom-color:var(--text);}
    .tab .dot{width:8px;height:8px;border-radius:50%;}
    .panel{display:none;flex:1;overflow-y:auto;padding:20px 24px;flex-direction:column;gap:20px;}.panel.active{display:flex;}
    .section-title{font-size:11px;font-weight:500;color:var(--hint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    .kpi{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:14px 16px;}
    .kpi-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
    .kpi-value{font-size:26px;font-weight:500;}
    .kpi-sub{font-size:11px;color:var(--hint);margin-top:3px;}
    .card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:16px;}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;font-size:11px;font-weight:500;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:.5px solid var(--border);}
    td{padding:9px 10px;border-bottom:.5px solid var(--border);}
    tr:last-child td{border-bottom:none;}
    .num{text-align:right;font-variant-numeric:tabular-nums;}
    .badge{font-size:11px;font-weight:500;padding:2px 9px;border-radius:12px;white-space:nowrap;}
    .badge-on{background:var(--green-bg);color:var(--green);}
    .badge-off{background:var(--red-bg);color:var(--red);}
    .badge-na{background:var(--bg);color:var(--muted);}
    .uptime-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .uptime-label{font-size:11px;color:var(--muted);width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .uptime-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;}
    .uptime-fill{height:100%;border-radius:4px;}
    .uptime-pct{font-size:11px;font-weight:500;width:36px;text-align:right;flex-shrink:0;}
    .empty{padding:40px;text-align:center;color:var(--hint);font-size:13px;}
    .legend-pill{display:inline-block;font-size:10px;color:var(--muted);margin-left:8px;}
    @media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}.two-col{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="topbar">
  <div><h1 id="pilot-title">Smart Plug Pilot — Comparativo</h1><p id="subtitle">Cargando datos...</p></div>
  <div class="topbar-right">
    <span class="pill pill-blue" id="active-badge">—</span>
    <span class="sync" id="last-sync">—</span>
  </div>
</div>
<div class="tabs" id="tabs"></div>

<!-- Panel comparativo -->
<div class="panel active" id="tab-compare">
  <div class="kpi-grid" id="cmpKpis"></div>
  <div class="two-col">
    <div class="card">
      <div class="section-title">Consumo de hoy por tecnología (Wh)</div>
      <div style="position:relative;height:200px;"><canvas id="cmpWhChart"></canvas></div>
    </div>
    <div class="card">
      <div class="section-title">Watts en tiempo real por tecnología</div>
      <div style="position:relative;height:200px;"><canvas id="cmpWChart"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="section-title">Todos los dispositivos</div>
    <table><thead><tr>
      <th>Tecnología</th><th>Dispositivo</th><th>Estado</th>
      <th class="num">Watts</th><th class="num">Wh hoy</th><th class="num">Uptime 7d</th>
    </tr></thead><tbody id="cmpTable"></tbody></table>
  </div>
</div>

<!-- Paneles por collector (generados) -->
<div class="panel" id="tab-tapo"></div>
<div class="panel" id="tab-emporia"></div>
<div class="panel" id="tab-shelly"></div>

<script>
const REPO="https://raw.githubusercontent.com/marcygcl/tapo-pilot/main";
const TZ="America/Bogota";
// Cada tecnología: clave de subcarpeta en energy_logs/ y color de marca.
const COLLECTORS=[
  {key:"tapo",    label:"Tapo",    color:"#378add"},
  {key:"emporia", label:"Emporia", color:"#639922"},
  {key:"shelly",  label:"Shelly",  color:"#ba7517"},
];
let CFG=null;
const DATA={}; // key -> {rows, latest, uptime, dailyWh, devices}

const getDays=n=>Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return d.toLocaleDateString('en-CA',{timeZone:TZ});});
const dayKey=ts=>new Date(ts).toLocaleDateString('en-CA',{timeZone:TZ});
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};

const fetchCSV=(coll,date)=>new Promise(res=>{
  Papa.parse(`${REPO}/energy_logs/${coll}/${date}.csv`,{download:true,header:true,
    complete:r=>res((r.data||[]).filter(x=>x&&x.timestamp&&typeof x.timestamp==="string")),
    error:()=>res([])});
});

function buildTabs(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=`<div class="tab active" data-tab="compare" onclick="switchTab('compare',this)">Comparativo</div>`+
    COLLECTORS.map(c=>`<div class="tab" data-tab="${c.key}" onclick="switchTab('${c.key}',this)"><span class="dot" style="background:${c.color}"></span>${c.label}</div>`).join("");
}
function switchTab(id,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("tab-"+id).classList.add("active");
}

// Etiqueta legible de un dispositivo (aula del config si existe, si no el alias).
function deviceLabel(coll,alias){
  const d=(DATA[coll].devices||{})[alias];
  return d&&d.aula?d.aula:alias;
}

async function loadCollector(coll){
  const days=getDays(7);
  const frames=await Promise.all(days.map(d=>fetchCSV(coll,d)));
  const rows=frames.flat().map(r=>({...r,is_on:r.is_on===""?null:parseInt(r.is_on),watts:num(r.watts),today_wh:num(r.today_wh)}));
  const latest={},uptime={};
  rows.forEach(r=>{latest[r.alias]=r;});
  const aliases=[...new Set(rows.map(r=>r.alias))];
  aliases.forEach(a=>{
    const ar=rows.filter(r=>r.alias===a&&r.is_on!==null);
    const on=ar.filter(r=>r.is_on===1).length;
    uptime[a]=ar.length?Math.round(on/ar.length*100):null;
  });
  // Wh consumido por día = max(today_wh) observado ese día (es acumulado).
  const dailyWh=frames.map(fr=>{
    const byA={};
    fr.forEach(r=>{const w=num(r.today_wh);if(!(r.alias in byA)||w>byA[r.alias])byA[r.alias]=w;});
    return +Object.values(byA).reduce((s,w)=>s+w,0).toFixed(1);
  });
  DATA[coll]={rows,latest,uptime,dailyWh,days,aliases};
}

function devicesFromConfig(){
  // tapo: alias/aula desde schools[].plugs; emporia: emporia.devices[]
  const tapo={};
  (CFG.schools||[]).forEach(s=>(s.plugs||[]).forEach(p=>{tapo[p.tapo_alias]={aula:p.aula,colegio:s.name};}));
  DATA.tapo.devices=tapo;
  const emp={};
  ((CFG.emporia||{}).devices||[]).forEach(d=>{emp[d.alias]={aula:d.aula,gid:d.gid};});
  DATA.emporia.devices=emp;
  DATA.shelly.devices={};
}

function estadoBadge(is_on){
  if(is_on===null||is_on===undefined)return `<span class="badge badge-na">N/A</span>`;
  return is_on===1?`<span class="badge badge-on">ON</span>`:`<span class="badge badge-off">OFF</span>`;
}
function upColor(u){return u===null?"#d3d1c7":u>=80?"#639922":u>=50?"#ef9f27":"#e24b4a";}

function renderCompare(){
  // KPIs: un resumen por tecnología.
  const kpis=document.getElementById("cmpKpis");
  kpis.innerHTML=COLLECTORS.map(c=>{
    const d=DATA[c.key];
    const aliases=d.aliases.length?d.aliases:Object.keys(d.devices||{});
    const active=aliases.filter(a=>d.latest[a]&&d.latest[a].is_on===1).length;
    const wNow=aliases.reduce((s,a)=>s+(d.latest[a]?d.latest[a].watts:0),0);
    const whToday=d.dailyWh.length?d.dailyWh[d.dailyWh.length-1]:0;
    const has=aliases.length>0;
    return `<div class="kpi">
      <div class="kpi-label"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:5px;"></span>${c.label}</div>
      <div class="kpi-value">${has?active+'<span style="font-size:16px;color:var(--muted)">/'+aliases.length+'</span>':'—'}</div>
      <div class="kpi-sub">${has?wNow.toFixed(1)+' W ahora · '+whToday+' Wh hoy':'sin datos aún'}</div>
    </div>`;
  }).join("");

  const dark=matchMedia("(prefers-color-scheme:dark)").matches;
  const tc=dark?"#888780":"#6b6a66",gc=dark?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.06)";
  const labels=COLLECTORS.map(c=>c.label),colors=COLLECTORS.map(c=>c.color);
  const whData=COLLECTORS.map(c=>{const dw=DATA[c.key].dailyWh;return dw.length?dw[dw.length-1]:0;});
  const wData=COLLECTORS.map(c=>{const d=DATA[c.key];return +(d.aliases.reduce((s,a)=>s+(d.latest[a]?d.latest[a].watts:0),0)).toFixed(1);});
  const barOpts=lbl=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{ticks:{color:tc,font:{size:11}},grid:{display:false},border:{display:false}},
            y:{ticks:{color:tc,font:{size:10},callback:v=>v+lbl},grid:{color:gc},border:{display:false}}}});
  new Chart(document.getElementById("cmpWhChart"),{type:"bar",data:{labels,datasets:[{data:whData,backgroundColor:colors,borderRadius:4}]},options:barOpts("Wh")});
  new Chart(document.getElementById("cmpWChart"),{type:"bar",data:{labels,datasets:[{data:wData,backgroundColor:colors,borderRadius:4}]},options:barOpts("W")});

  // Tabla combinada.
  const tb=document.getElementById("cmpTable");
  let html="";
  COLLECTORS.forEach(c=>{
    const d=DATA[c.key];
    const aliases=d.aliases.length?d.aliases:Object.keys(d.devices||{});
    aliases.forEach(a=>{
      const r=d.latest[a],u=d.uptime[a];
      html+=`<tr>
        <td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:6px;"></span>${c.label}</td>
        <td>${deviceLabel(c.key,a)}</td>
        <td>${estadoBadge(r?r.is_on:null)}</td>
        <td class="num">${r?r.watts.toFixed(1):'—'}</td>
        <td class="num">${r?r.today_wh.toFixed(1):'—'}</td>
        <td class="num" style="color:${upColor(u)}">${u!==null&&u!==undefined?u+'%':'—'}</td>
      </tr>`;
    });
  });
  tb.innerHTML=html||`<tr><td colspan="6" class="empty">Sin datos todavía.</td></tr>`;
}

function renderCollectorPanel(c){
  const d=DATA[c.key];
  const panel=document.getElementById("tab-"+c.key);
  const aliases=d.aliases.length?d.aliases:Object.keys(d.devices||{});
  if(!aliases.length){
    panel.innerHTML=`<div class="card"><div class="empty">No hay datos de <b>${c.label}</b> todavía.<br>Se llenará cuando el collector <code>collectors/${c.key}/collect.py</code> empiece a registrar en <code>energy_logs/${c.key}/</code>.</div></div>`;
    return;
  }
  const rowsHtml=aliases.map(a=>{
    const r=d.latest[a],u=d.uptime[a];
    return `<tr>
      <td>${deviceLabel(c.key,a)}</td>
      <td>${estadoBadge(r?r.is_on:null)}</td>
      <td class="num">${r?r.watts.toFixed(1):'—'}</td>
      <td class="num">${r?r.today_wh.toFixed(1):'—'}</td>
      <td class="num" style="color:${upColor(u)}">${u!==null?u+'%':'—'}</td>
    </tr>`;
  }).join("");
  const upHtml=aliases.map(a=>{
    const u=d.uptime[a];
    return `<div class="uptime-row"><div class="uptime-label">${deviceLabel(c.key,a)}</div>
      <div class="uptime-track"><div class="uptime-fill" style="width:${u||0}%;background:${upColor(u)}"></div></div>
      <div class="uptime-pct" style="color:${upColor(u)}">${u!==null?u+'%':'—'}</div></div>`;
  }).join("");
  panel.innerHTML=`
    <div class="card">
      <div class="section-title">Dispositivos ${c.label} — lectura más reciente</div>
      <table><thead><tr><th>Dispositivo</th><th>Estado</th><th class="num">Watts</th><th class="num">Wh hoy</th><th class="num">Uptime 7d</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="section-title">Consumo diario — últimos 7 días (Wh)</div>
        <div style="position:relative;height:170px;"><canvas id="trend-${c.key}"></canvas></div>
      </div>
      <div class="card">
        <div class="section-title">Uptime 7 días por dispositivo</div>
        ${upHtml}
      </div>
    </div>`;
  const dark=matchMedia("(prefers-color-scheme:dark)").matches;
  const tc=dark?"#888780":"#6b6a66",gc=dark?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.06)";
  new Chart(document.getElementById("trend-"+c.key),{type:"bar",
    data:{labels:d.days.map(x=>x.slice(5)),datasets:[{data:d.dailyWh,backgroundColor:d.days.map((_,i)=>i===6?c.color:c.color+"88"),borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:tc,font:{size:10}},grid:{display:false},border:{display:false}},
              y:{ticks:{color:tc,font:{size:10},callback:v=>v+"Wh"},grid:{color:gc},border:{display:false}}}}});
}

async function main(){
  buildTabs();
  const resp=await fetch(`${REPO}/config.json`);
  CFG=await resp.json();
  if(CFG.pilot&&CFG.pilot.name)document.getElementById("pilot-title").textContent=CFG.pilot.name+" — Comparativo";

  await Promise.all(COLLECTORS.map(c=>loadCollector(c.key)));
  devicesFromConfig();

  renderCompare();
  COLLECTORS.forEach(renderCollectorPanel);

  // Topbar resumen.
  let totalDev=0,totalActive=0,lastTs="";
  COLLECTORS.forEach(c=>{
    const d=DATA[c.key];
    const aliases=d.aliases.length?d.aliases:Object.keys(d.devices||{});
    totalDev+=aliases.length;
    totalActive+=aliases.filter(a=>d.latest[a]&&d.latest[a].is_on===1).length;
    d.rows.forEach(r=>{if(r.timestamp>lastTs)lastTs=r.timestamp;});
  });
  document.getElementById("subtitle").textContent=`${COLLECTORS.length} tecnologías · ${totalDev} dispositivos · sync cada 5 min`;
  document.getElementById("active-badge").textContent=`${totalActive}/${totalDev} activos`;
  document.getElementById("last-sync").textContent=lastTs?`Última: ${lastTs.slice(0,16).replace("T"," ")}`:"Sin lecturas";
}
main().catch(e=>{document.getElementById("subtitle").textContent="Error: "+e.message;});
</script>
</body>
</html>
