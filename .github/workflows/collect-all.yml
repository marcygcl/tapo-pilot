name: Collect all data

on:
  repository_dispatch:
    types: [tapo-collect-all]
  workflow_dispatch:

jobs:
  collect-shelly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHELLY_SERVER: ${{ secrets.SHELLY_SERVER }}
      SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run python collectors/shelly/collect.py --once
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add energy_logs/shelly/
          if ! git diff --cached --quiet; then
            git commit -m "data(shelly): $(date -u +'%Y-%m-%d %H:%M') UTC"
            # 4 jobs pushean en paralelo al mismo ref → carrera. Reintentar re-pulleando
            # (el push rechazado es non-fast-forward: hace falta rebasar sobre lo recién
            # pusheado por otro job, no solo reintentar el push). Jitter aleatorio para
            # desincronizar los reintentos. Carpetas disjuntas ⇒ el rebase nunca conflictúa.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash && git push; then
                exit 0
              fi
              [ $attempt -lt 5 ] && sleep $((RANDOM % 10 + 5))
            done
            echo "Push failed after 5 retries"
            exit 1
          fi

  collect-emporia:
