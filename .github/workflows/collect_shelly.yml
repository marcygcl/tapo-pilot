name: Collect Shelly data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHELLY_SERVER:   ${{ secrets.SHELLY_SERVER }}
      SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Run Shelly collector
        env:
          TIMEZONE:        America/Bogota
          SCHOOL_START:    "07:00"
          SCHOOL_END:      "16:00"
        run: uv run python collectors/shelly/collect.py --once

      - name: Commit CSV data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add energy_logs/
          git diff --staged --quiet && echo "No new data" && exit 0
          git stash
          git pull --rebase
          git stash pop
          git add energy_logs/
          git commit -m "data(shelly): $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
