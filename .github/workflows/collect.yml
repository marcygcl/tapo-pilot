name: Collect plug data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Run Tapo collector
        continue-on-error: true
        env:
          TAPO_EMAIL:    ${{ secrets.TAPO_EMAIL }}
          TAPO_PASSWORD: ${{ secrets.TAPO_PASSWORD }}
          TIMEZONE:      America/Bogota
          SCHOOL_START:  "07:00"
          SCHOOL_END:    "16:00"
          FLAG_THRESHOLD_DAYS: "1"
        run: uv run python collectors/tapo/collect.py --once

      - name: Run Emporia collector
        continue-on-error: true
        env:
          EMPORIA_EMAIL:    ${{ secrets.EMPORIA_EMAIL }}
          EMPORIA_PASSWORD: ${{ secrets.EMPORIA_PASSWORD }}
          TIMEZONE:         America/Bogota
          SCHOOL_START:     "07:00"
          SCHOOL_END:       "16:00"
        run: uv run python collectors/emporia/collect.py --once

      - name: Send alerts
        continue-on-error: true
        env:
          TWILIO_SID:      ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:    ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM_SMS: ${{ secrets.TWILIO_FROM_SMS }}
          TWILIO_FROM_WA:  ${{ secrets.TWILIO_FROM_WA }}
          ALERT_TO:        ${{ secrets.ALERT_TO }}
          TIMEZONE:        America/Bogota
          SCHOOL_START:    "07:00"
          SCHOOL_END:      "16:00"
          FLAG_THRESHOLD_DAYS: "1"
        run: uv run python scripts/alerts.py

      - name: Commit CSV data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add energy_logs/
          git diff --staged --quiet && echo "No new data" && exit 0
          git stash
          git pull --rebase
          git stash pop
          git add energy_logs/
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
