name: Collect plug data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # Trigger externo (p.ej. cron-job.org) vía POST a /repos/{owner}/{repo}/dispatches
  # con body {"event_type":"collect"}.
  repository_dispatch:
    types: [collect]

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EMPORIA_EMAIL:    ${{ secrets.EMPORIA_EMAIL }}
      EMPORIA_PASSWORD: ${{ secrets.EMPORIA_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      # El collector de Tapo NO corre en CI: usa la API local de los plugs
      # (red Wi-Fi del colegio) y GitHub Actions no tiene acceso a esa red.
      # Se ejecuta localmente con: uv run python collectors/tapo/collect.py

      - name: Run Emporia collector
        env:
          TIMEZONE:         America/Bogota
          SCHOOL_START:     "07:00"
          SCHOOL_END:       "16:00"
        run: uv run python collectors/emporia/collect.py --once

      - name: Run Shelly collector
        continue-on-error: true
        env:
          SHELLY_SERVER:   ${{ secrets.SHELLY_SERVER }}
          SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
          TIMEZONE:        America/Bogota
          SCHOOL_START:    "07:00"
          SCHOOL_END:      "16:00"
        run: uv run python collectors/shelly/collect.py --once

      - name: Commit CSV data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add energy_logs/
          git diff --staged --quiet && echo "No new data" && exit 0
          git stash
          git pull --rebase
          git stash pop
          git add energy_logs/
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
